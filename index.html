<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey Form System 2027</title>
  <meta name="description" content="2027 Academic Year Response Survey — DECA, ART, BPA, FBLA, FCCLA, JROTC, MCO, STEM" />
  <link rel="stylesheet" href="shared/form-styles.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="survey-container">

    <!-- SELECTOR MODE -->
    <div id="selectorMode" class="selector-mode">
      <div class="selector-header">
        <h1>Survey Form System</h1>
        <p>2027 Academic Year Response Survey</p>
      </div>
      <div class="selector-card">
        <h2>Select Your Form Type</h2>
        <p>Choose the survey form you need to complete</p>
        <div class="form-selector">
          <select id="formTypeSelect" class="form-select">
            <option value="">-- Select Form Type --</option>
            <option value="DECA">DECA-27</option>
            <option value="ART">ART-27</option>
            <option value="BPA">BPA-27</option>
            <option value="FBLA">FBLA-27</option>
            <option value="FCCLA">FCCLA-27</option>
            <option value="JROTC">JROTC-27</option>
            <option value="MCO">MCO-27</option>
            <option value="STEM">STEM-27</option>
            <option value="ACTFL">ACTFL-27</option>
            <option value="NCSS">NCSS-27</option>
          </select>
        </div>
        <button class="btn btn-primary" id="loadFormBtn" disabled>Load Form</button>
        <button class="btn btn-secondary" id="viewRecordsBtn">View Stored Records</button>
      </div>
    </div>

    <!-- FORM MODE -->
    <div id="formMode" class="form-mode hidden">
      <div class="survey-header">
        <button class="btn-back" id="backBtn">&#8592; Back</button>
        <div class="header-content">
          <h1 id="formTitle">Survey Form</h1>
          <p id="formSubtitle">2027 Academic Year Response Survey</p>
        </div>
      </div>
      <div class="survey-content">
        <div class="main-content">
          <div id="formFields"></div>
          <div class="top-actions">
            <button class="btn btn-submit" id="submitBtn">Submit</button>
            <button class="btn btn-clear" id="clearBtn">Clear Form</button>
            <button class="btn btn-download" id="downloadBtn">Download Excel</button>
            <button class="btn btn-delete" id="deleteAllBtn">Delete All Stored Data</button>
          </div>
          <div class="live-footer">
            <div class="live-header">
              <h2>Stored Records</h2>
            </div>
            <div class="table-wrapper">
              <table class="record-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>EVID</th>
                    <th>Form</th>
                    <th>Survey Type</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="recordTableBody">
                  <tr>
                    <td colspan="5" class="empty-record">No records yet.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const TEMPLATE_CONFIG_MAP = {
      DECA:  "forms/DECA-27/DECA-27-config.js",
      ART:   "forms/ART-27/ART-27-config.js",
      BPA:   "forms/BPA-27/BPA-27-config.js",
      FBLA:  "forms/FBLA-27/FBLA-27-config.js",
      FCCLA: "forms/FCCLA-27/FCCLA-27-config.js",
      JROTC: "forms/JROTC-27/JROTC-27-config.js",
      MCO:   "forms/MCO-27/MCO-27-config.js",
      STEM:  "forms/STEM-27/STEM-27-config.js",
      ACTFL: "forms/ACTFL-27/ACTFL-27-config.js",
      NCSS:  "forms/NCSS-27/NCSS-27-config.js"
    };

    let _activeConfigScript = null;

    function loadTemplateConfig(formKey, callback) {
      const path = TEMPLATE_CONFIG_MAP[formKey];
      if (!path) { console.error("Unknown form key:", formKey); return; }

      if (_activeConfigScript) {
        _activeConfigScript.remove();
        _activeConfigScript = null;
      }

      const s = document.createElement("script");
      s.src = path + "?v=" + Date.now();
      s.onload = callback;
      s.onerror = () => console.error("Failed to load config:", path);
      _activeConfigScript = s;
      document.head.appendChild(s);
    }
  </script>

  <script src="shared/form-handler.js?v=1.0.1"></script>
</body>
</html>
